<!-- Hero Section -->
<section class="relative pt-40 pb-64 overflow-hidden">
    <div
        class="absolute top-20 left-1/2 -translate-x-1/2 w-[1000px] h-[600px] bg-blue-600/10 blur-[120px] rounded-full -z-10">
    </div>
    <div class="absolute -top-40 -left-40 w-[600px] h-[600px] bg-purple-600/10 blur-[100px] rounded-full -z-10">
    </div>

    <div class="container mx-auto px-6 text-center">

        <h1 class="text-5xl md:text-8xl font-extrabold mb-8 tracking-tighter leading-tight gradient-text">
            Draw on Your Desktop
        </h1>

        <p class="text-zinc-400 text-lg md:text-xl max-w-2xl mx-auto mb-12 leading-relaxed">
            Your desktop screen becomes a drawing board, making your explanations clearer.
        </p>

        <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
            <a href="#" class="inline-block hover:opacity-80 transition-opacity">
                <img src="/images/app-store-badge.svg" alt="Download on the App Store" class="h-[60px] w-auto">
            </a>
            <span class="text-white font-bold text-xl border-b-4 border-blue-500 pb-1">It's Free</span>
            <!-- <button
                    class="w-full sm:w-auto glass border border-white/10 px-8 py-4 rounded-full font-bold text-lg hover:bg-white/5 transition-all flex items-center justify-center gap-2">
                    <i data-lucide="play" class="w-5 h-5 fill-current"></i>
                    Watch Demo
                </button> -->
        </div>
    </div>
</section>

<!-- Main Product Video Placeholder -->
<div class="container mx-auto px-6 -mt-24 md:-mt-48 relative z-10 mb-32">
    <div class="video-placeholder aspect-video shadow-2xl shadow-blue-500/10 relative">
        <video loop muted playsinline preload="none" poster="/images/hero-poster.jpg"
            data-poster-mobile="/images/hero-poster-m.jpg"
            class="lazy-video absolute inset-0 w-full h-full object-cover rounded-2xl">
            <source data-src="/images/hero-m.mp4?v={{ site.time | date: '%s' }}" media="(max-width: 720px)"
                type="video/mp4">
            <source data-src="/images/hero.mp4?v={{ site.time | date: '%s' }}" type="video/mp4">
        </video>
    </div>
</div>
